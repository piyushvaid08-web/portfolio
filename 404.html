<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }
      .card {
        max-width: 640px;
        padding: 3rem;
        border-radius: 2rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(24px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="text-sm uppercase tracking-[0.3em] text-accent">404</p>
      <h1 style="font-size: 3rem; margin: 1rem 0; color: white;">This page is not here.</h1>
      <p style="line-height: 1.8; color: rgba(255,255,255,0.7);">The page you are looking for has moved, vanished, or never existed. Return to the studio and discover the portfolio.</p>
      <a href="index.html" style="display:inline-block; margin-top:1.5rem; padding: 0.8rem 1.2rem; border-radius: 999px; background: rgba(201,168,106,0.14); color: #c9a86a;">Return Home</a>
    </div>
  </body>
</html>
